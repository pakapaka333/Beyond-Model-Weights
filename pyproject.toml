[project]
name = "beyond-model-weights"
version = "1.0.0"
description = "Sampling-dependent fairness in diffusion language models"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Pinned to third_party/dOPSD/environment.yaml.
    "torch==2.8.0",
    "accelerate==1.11.0",
    "transformers==4.57.1",
    "trl==0.26.0",
    "datasets==3.6.0",
    "deepspeed==0.18.2",
    "peft==0.17.1",
    "bitsandbytes==0.48.2",
    "wandb==0.22.3",
    "vllm==0.11.0",
    "xformers==0.0.32.post1",
    "triton==3.4.0",
    "einops==0.8.1",
    "safetensors==0.5.3",
    "sentencepiece==0.1.99",
    "tiktoken==0.9.0",
    "math-verify==0.8.0",
    "nltk==3.10.3",
]

[dependency-groups]
# dOPSD's lm-eval fork, which registers the `diffllm` model; IFEval imports the other two.
eval = [
    "lm-eval",
    "immutabledict",
    "langdetect",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
lm-eval = { path = "third_party/dOPSD/eval/Dream/eval_instruct", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
