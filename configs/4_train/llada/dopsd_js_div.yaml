# LLaDA-8B-Instruct: dOPSD + JS div. (Zhao et al., 2024).
model_name_or_path: GSAI-ML/LLaDA-8B-Instruct
student_backend: llada
mask_token_id: 126336
torch_dtype: bfloat16
attn_implementation: eager
gradient_checkpointing: false
use_peft: true
lora_r: 32
lora_dropout: 0.0
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

dataset: openbbq_train_10k
max_prompt_length: 256
max_answer_length: 64

answer_match: exact_boxed
filter_wrong_rollouts: false
use_grpo: false
fixed_teacher: true
beta: 0.0
temperature: 1.0
traj_step_select: random
traj_teacher_view: all_future
gen_temperature: 1.0
gen_alg_temp: 0.5

fair_term: js_div
fair_coef: 30.0
fair_lexicon: data/lexicon/llada/regrouped/lexicon.json

output_dir: ../../outputs
run_config: llada/dopsd_js_div
learning_rate: 4.0e-5
per_device_train_batch_size: 4
max_steps: 938
seed: 1234
logging_steps: 2
save_steps: 100
wandb_project: beyond-model-weights

