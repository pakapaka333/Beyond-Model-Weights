# OpenBBQ with Dream-v0-Instruct-7B at its released sampler settings
# (whole-window decoding, TPS = 1, entropy remasking). Pass --adapter for a tuned model.
entrypoint: eval_openbbq
data: data/openbbq/test-10k/train.jsonl
batch_size: 8
model:
  backend: dream
  model_path: Dream-org/Dream-v0-Instruct-7B
  gen_length: 256
  steps: 256
  temperature: 0.1
  top_p: 0.9
  alg: entropy
  alg_temp: 0.0
